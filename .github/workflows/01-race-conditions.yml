name: 01-race-conditions

on:
  push:
    branches: [main]
    paths: ["01-race-conditions/**", ".github/workflows/01-race-conditions.yml"]
  pull_request:
    paths: ["01-race-conditions/**", ".github/workflows/01-race-conditions.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01-race-conditions/backend
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_USER: prize
          POSTGRES_PASSWORD: prize
          POSTGRES_DB: prize
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prize -d prize"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://prize:prize@localhost:5432/prize
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: psql "$TEST_DATABASE_URL" -f ../infra/postgres/init.sql
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check src tests
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01-race-conditions/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: 01-race-conditions/frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
