[project]
name = "race-conditions"
version = "1.0.0"
description = "Many users, one shared resource - a race condition and three ways to fix it"
requires-python = ">=3.15"
dependencies = [
    "aio-pika>=10.2.3",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.165.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-asyncpg>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "pydantic-settings>=2.16.3",
]

[project.scripts]
race-conditions-worker = "race_conditions.worker:main"

[dependency-groups]
dev = [{ include-group = "lint" }, { include-group = "test" }]
lint = [
    "asyncpg-stubs>=0.32.0",
    "ruff>=0.17.6",
    "ty>=0.0.111",
]
test = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "race_conditions.main:app"

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       
    "COM812",  
    "ISC001",  
    "CPY001",  
    "TC",      
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]

[tool.ty.environment]
python-version = "3.15"

[tool.ty.rules]
possibly-unresolved-reference = "error"
unused-ignore-comment = "warn"

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs a running Postgres (DATABASE_URL)"]
