name: race-conditions

x-api: &api
  build: ./backend
  environment: &api-env
    DATABASE_URL: postgresql://prize:prize@postgres:5432/prize
    RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ADMIN_TOKEN: ${ADMIN_TOKEN:-lecturer}
    PUBLIC_RESET: ${PUBLIC_RESET:-true}
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://prometheus:9090/api/v1/otlp/v1/metrics
    WATCHFILES_FORCE_POLLING: "true"
  volumes:
    - ./backend/src:/app/src
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped
  command:
    - uvicorn
    - race_conditions.main:app
    - --host=0.0.0.0
    - --port=8000
    - --no-access-log
    - --reload
    - --reload-dir=/app/src
    # Open SSE streams never end; without this a reload waits for every board to close.
    - --timeout-graceful-shutdown=1

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: prize
      POSTGRES_PASSWORD: prize
      POSTGRES_DB: prize
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${TOOLS_ADDR:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prize -d prize"]
      interval: 2s
      timeout: 3s
      retries: 30

  app1:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE: app1

  app2:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE: app2

  nginx:
    build: ./frontend
    ports:
      - "${APP_ADDR:-0.0.0.0}:${APP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app1, app2]
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    ports:
      - "${TOOLS_ADDR:-127.0.0.1}:16686:16686"

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
      - --web.enable-otlp-receiver
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${TOOLS_ADDR:-127.0.0.1}:9090:9090"

  grafana:
    image: grafana/grafana:13.3.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/race-conditions.json
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${TOOLS_ADDR:-127.0.0.1}:3000:3000"
    depends_on: [prometheus, jaeger]

  rabbitmq:
    image: rabbitmq:4.4.1-management
    profiles: [broker]
    volumes:
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "${TOOLS_ADDR:-127.0.0.1}:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    <<: *api
    profiles: [broker]
    command: ["race-conditions-worker"]
    environment:
      <<: *api-env
      WORKER_STRATEGY: ${WORKER_STRATEGY:-naive}
      WORKER_PREFETCH: ${WORKER_PREFETCH:-1}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  k6:
    image: grafana/k6:2.4.0
    profiles: [load]
    volumes:
      - ./load:/scripts:ro
    environment:
      BASE: http://nginx
    depends_on: [nginx]
